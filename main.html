<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="player">

        <video class="player__video viewer"
               src="https://www.w3schools.com/html/mov_bbb.mp4">
        </video>

        <div class="player__controls">

            <!-- Progress bar -->
            <div class="progress">
                <div class="progress__filled"></div>
            </div>

            <!-- Play / Pause -->
            <button class="player__button toggle" title="Toggle Play">
                ►
            </button>

            <!-- Volume -->
            <input type="range"
                   class="volume"
                   min="0"
                   max="1"
                   step="0.05"
                   value="1">

            <!-- Playback speed -->
            <input type="range"
                   class="playbackSpeed"
                   min="0.5"
                   max="2"
                   step="0.1"
                   value="1">

            <!-- Rewind -->
            <button data-skip="-10">« 10s</button>

            <!-- Forward -->
            <button data-skip="25">25s »</button>

        </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
